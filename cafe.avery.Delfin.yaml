app-id: cafe.avery.Delfin
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20

command: delfin

finish-args:
  - --share=network
  # X11
  - --share=ipc
  - --socket=fallback-x11
  # Wayland
  - --socket=wayland
  # Hardware acceleration
  - --device=dri
  # Audio
  - --socket=pulseaudio

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  env:
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
    CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=/usr/lib/sdk/rust-stable/bin/mold
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: clang
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=/usr/lib/sdk/rust-stable/bin/mold

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/bash-completion
  - /share/doc
  - /share/ladspa
  - /share/man
  - /share/zsh
  - '*.a'
  - '*.la'

modules:
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dbuild-date=false
      - -Dcplayer=false
      - -Dlibmpv=true
      - -Dmanpage-build=disabled
      - -Dlibarchive=enabled
      # - -Dsdl2=enabled
      - -Dvulkan=enabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
    modules:
      - name: libXmu
        buildsystem: autotools
        sources:
          - type: git
            url: https://gitlab.freedesktop.org/xorg/lib/libxmu.git
            tag: libXmu-1.3.1
            commit: cdf280f6611932f79ab872832974e8043b1cad6d
            x-checker-data:
              type: git
              tag-pattern: ^libXmu-([\d.]+)$

      - name: xclip
        buildsystem: autotools
        sources:
          - type: git
            url: https://github.com/astrand/xclip.git
            tag: '0.13'
            commit: 9aa7090c3b8b437c6489edca32ae43d82e0c1281
            x-checker-data:
              type: git
              tag-pattern: ^(\d+\.\d+)$

      - name: libXpresent
        buildsystem: autotools
        sources:
          - type: git
            url: https://gitlab.freedesktop.org/xorg/lib/libxpresent.git
            tag: libXpresent-1.0.2
            commit: 4d92149372461bf575e8a09b1064a2884c38c3aa
            x-checker-data:
              type: git
              tag-pattern: ^libXpresent-([\d.]+)$

      - shared-modules/luajit/luajit.json

      - name: uchardet
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DBUILD_STATIC=0
          - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cleanup:
          - /bin
        sources:
          - type: archive
            url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
            sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
            x-checker-data:
              type: html
              url: https://www.freedesktop.org/software/uchardet/releases/
              version-pattern: uchardet-(\d\.\d+\.?\d*).tar.xz
              url-template: https://www.freedesktop.org/software/uchardet/releases/uchardet-$version.tar.xz

      - name: libass
        config-opts:
          - --disable-static
        sources:
          - type: git
            url: https://github.com/libass/libass.git
            tag: 0.17.4
            commit: bbb3c7f1570a4a021e52683f3fbdf74fe492ae84
            x-checker-data:
              type: git
              tag-pattern: ^(\d\.\d{1,3}\.\d{1,2})$

      - name: zimg
        config-opts:
          - --disable-static
        sources:
          - type: archive
            archive-type: tar
            url: https://api.github.com/repos/sekrit-twc/zimg/tarball/release-3.0.6
            sha256: 15140e491c4ce9db5f02a038d8a1eb53e9151b55eeed06a2899425a6ebfef367
            x-checker-data:
              type: json
              url: https://api.github.com/repos/sekrit-twc/zimg/releases/latest
              url-query: .tarball_url
              version-query: .tag_name | sub("^release-"; "")
              timestamp-query: .published_at

      - name: rubberband
        buildsystem: meson
        sources:
          - type: git
            url: https://github.com/breakfastquay/rubberband.git
            mirror-urls:
              - https://hg.sr.ht/~breakfastquay/rubberband
            tag: v4.0.0
            commit: 1d95888bec3ae0a17c0c4af791810d5a63f6bc35
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$

      - name: mujs
        buildsystem: autotools
        no-autogen: true
        make-args:
          - release
        make-install-args:
          - prefix=/app
          - install-shared
        cleanup:
          - /bin
        sources:
          - type: archive
            url: https://codeberg.org/ccxvii/mujs/archive/1.3.8.tar.gz
            sha256: 10e8548033924ada0828a821777371861ea3e127d472e8423ad87426118291d9
          # The unicode character database files are downloaded in the makefile rules `UnicodeData.txt` and `SpecialCasing.txt`.
          - type: file
            url: https://www.unicode.org/Public/16.0.0/ucd/UnicodeData.txt
            sha256: ff58e5823bd095166564a006e47d111130813dcf8bf234ef79fa51a870edb48f
          - type: file
            url: https://www.unicode.org/Public/16.0.0/ucd/SpecialCasing.txt
            sha256: 8d5de354eef79f2395a54c9c7dcebbaf3d30fc962d0f85611ea97aa973a0c451

      - name: x264
        config-opts:
          - --disable-cli
          - --enable-shared
        sources:
          - type: git
            url: https://code.videolan.org/videolan/x264.git
            # branch: stable
            commit: 31e19f92f00c7003fa115047ce50978bc98c3a0d

      - name: x265
        buildsystem: cmake-ninja
        subdir: source
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DBUILD_STATIC=0
        sources:
          - type: git
            url: https://bitbucket.org/multicoreware/x265_git.git
            tag: '4.2'
            commit: e444744c03978c1fb4e037168967020cf2648427
            x-checker-data:
              type: git
              tag-pattern: ^([\d.]+)$

      - name: libmysofa
        buildsystem: cmake-ninja
        config-opts:
          - -DBUILD_TESTS=OFF
        sources:
          - type: git
            commit: 7a0c07111a3d7230ec534e08925c24a7525f33c0
            tag: v1.3.4
            url: https://github.com/hoene/libmysofa.git
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$

      - name: libbs2b
        buildsystem: autotools
        config-opts:
          - --disable-static
        sources:
          - type: archive
            archive-type: tar
            url: https://downloads.sourceforge.net/sourceforge/bs2b/libbs2b-3.1.0.tar.gz
            sha256: 6aaafd81aae3898ee40148dd1349aab348db9bfae9767d0e66e0b07ddd4b2528
            x-checker-data:
              type: html
              url: https://sourceforge.net/projects/bs2b/files/libbs2b/
              version-pattern: projects/bs2b/files/libbs2b/(\d+\.\d+\.\d+)
              url-template: https://downloads.sourceforge.net/sourceforge/bs2b/libbs2b-$version.tar.gz
          # https://src.fedoraproject.org/rpms/libbs2b/blob/rawhide/f/libbs2b.spec#_40
          - type: shell
            commands:
              - sed -i -e 's/lzma/xz/g' configure.ac
              - autoreconf -vif

      - name: ffmpeg
        cleanup:
          - /share/ffmpeg/examples
        config-opts:
          - --disable-debug
          - --disable-doc
          - --disable-static
          - --enable-encoder=png
          - --enable-gnutls
          - --enable-gpl
          - --enable-shared
          - --enable-version3
          - --enable-libaom
          - --enable-libass
          - --enable-libbs2b
          - --enable-libdav1d
          - --enable-libfreetype
          - --enable-libmp3lame
          - --enable-libopus
          - --enable-libjxl
          - --enable-libmysofa
          - --enable-libtheora
          - --enable-libvorbis
          - --enable-libvpx
          - --enable-libx264
          - --enable-libx265
          - --enable-libwebp

        sources:
          - type: git
            url: https://github.com/FFmpeg/FFmpeg.git
            mirror-urls:
              - https://git.ffmpeg.org/ffmpeg.git
            commit: 9047fa1b084f76b1b4d065af2d743df1b40dfb56
            tag: n8.1
            x-checker-data:
              type: git
              tag-pattern: ^n([\d.]{3,7})$

      - name: libsixel
        buildsystem: meson
        sources:
          - type: archive
            archive-type: tar
            url: https://api.github.com/repos/libsixel/libsixel/tarball/refs/tags/v1.10.5
            sha256: 402da9e24caea62fe1e4c5d6f9c9211141f7a5d8016e717527ecde10c5522344
            x-checker-data:
              type: json
              url: https://api.github.com/repos/libsixel/libsixel/tags
              url-query: .[0].tarball_url
              version-query: .[0].name

      - name: vapoursynth
        buildsystem: meson
        sources:
          - type: archive
            # without the dest-filename, flatpak-builder throws an "Unknown archive format" error
            dest-filename: vapoursynth.tar.gz
            url: https://api.github.com/repos/vapoursynth/vapoursynth/tarball/R74
            sha256: d51699378e112fa81a3669c23a847cbc30d491a853e2c15ded236905698f166a
            x-checker-data:
              type: json
              url: https://api.github.com/repos/vapoursynth/vapoursynth/releases/latest
              version-query: .name
              timestamp-query: .published_at
              url-query: .tarball_url

      - name: libplacebo
        buildsystem: meson
        config-opts:
          - -Dvulkan=enabled
          - -Dshaderc=enabled
        sources:
          - type: git
            url: https://code.videolan.org/videolan/libplacebo.git
            mirror-urls:
              - https://github.com/haasn/libplacebo.git
            tag: v7.360.1
            commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$

  - name: delfin
    buildsystem: meson
    config-opts:
      - -Dprofile=release
      - -Dflatpak=true
    sources:
      - type: archive
        url: https://codeberg.org/avery42/delfin/releases/download/v0.4.8/delfin-flatpak-dist-v0.4.8.tar.xz
        sha256: 56d6f51ceab544f5ec077e79b946df643f927155f242f17ad54005ecc12e611f
